# Render Blueprint — static site, no build step required.
# Deploy: Dashboard → New → Blueprint → point at this repo.
services:
  - type: web
    name: dhoni-vs-gambhir
    runtime: static
    repo: https://github.com/ayushshukla7777/dhoni-vs-gambhir
    branch: main
    # No build step: the site is plain HTML/CSS/JS committed at the repo root.
    buildCommand: ""
    staticPublishPath: .
    autoDeploy: true
